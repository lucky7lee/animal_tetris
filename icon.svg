  <!-- 눈 (좌, 우) -->
  <circle cx="190" cy="280" r="22" fill="#1E1B4B"/>
  <circle cx="180" cy="272" r="8" fill="#FFFFFF"/>
  <circle cx="196" cy="286" r="4" fill="#FFFFFF"/>
  
  <circle cx="322" cy="280" r="22" fill="#1E1B4B"/>
  <circle cx="312" cy="272" r="8" fill="#FFFFFF"/>
  <circle cx="328" cy="286" r="4" fill="#FFFFFF"/>
  
  <!-- 볼터치 -->
  <ellipse cx="150" cy="330" rx="25" ry="16" fill="#F43F5E" opacity="0.6"/>
  <ellipse cx="362" cy="330" rx="25" ry="16" fill="#F43F5E" opacity="0.6"/>
  
  <!-- 코 -->
