<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#EDE9FE">
  <meta name="description" content="PC와 모바일 웹에서 즐기는 귀여운 동물 얼굴 블록 테트리스 게임">
  <title>🐾 귀여운 동물 테트리스 (Animal Tetris)</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 상단 네비게이션 헤더 -->
  <header>
    <div class="title-wrap">
      <h1 class="game-title">🐾 동물 테트리스</h1>
      <span class="title-badge">Web</span>
    </div>
    <div class="top-actions">
      <button id="soundBtn" class="icon-btn active" title="효과음 On/Off" aria-label="효과음">🔊</button>
      <button id="bgmBtn" class="icon-btn" title="배경음악 On/Off" aria-label="배경음악">🎶</button>
      <button id="pauseBtn" class="icon-btn" title="일시정지" aria-label="일시정지">⏸</button>
    </div>
  </header>

  <!-- 모바일 전용 상단 미니 대시보드 (스마트폰에서만 표시) -->
  <div class="mobile-top-dashboard">
    <div class="mobile-card" style="max-width: 65px;">
      <span class="label">HOLD</span>
      <canvas id="mobHoldCanvas" width="46" height="46" style="width:46px;height:46px;border-radius:8px;background:rgba(255,255,255,0.7);"></canvas>
    </div>
    <div class="mobile-card">
      <span class="label">SCORE</span>
      <span id="mobScoreValue" class="val">0</span>
    </div>
    <div class="mobile-card">
      <span class="label">LV / LINE</span>
      <span class="val"><span id="mobLevelValue">1</span> / <span id="mobLinesValue">0</span></span>
    </div>
    <div class="mobile-card" style="max-width: 65px;">
      <span class="label">NEXT</span>
      <canvas id="mobNextCanvas" width="46" height="46" style="width:46px;height:46px;border-radius:8px;background:rgba(255,255,255,0.7);"></canvas>
    </div>
  </div>

  <!-- 메인 게임 영역 -->
  <main class="game-container">
    
    <!-- 좌측 사이드 패널 (PC) -->
    <aside class="side-panel left-panel">
      <!-- HOLD 카드 -->
      <div class="panel-card">
        <div class="panel-title">📦 HOLD (C)</div>
        <canvas id="holdCanvas" class="mini-canvas" width="90" height="90"></canvas>
      </div>

      <!-- 레벨 & 라인 카드 -->
      <div class="panel-card">
        <div class="panel-title">⭐ LEVEL</div>
        <div id="levelValue" class="stat-value">1</div>
      </div>
      <div class="panel-card">
        <div class="panel-title">🎯 LINES</div>
        <div id="linesValue" class="stat-value">0</div>
      </div>
    </aside>

    <!-- 중앙 게임 보드 -->
    <div class="board-wrapper">
      <div class="canvas-frame">
        <canvas id="tetrisCanvas" width="300" height="600"></canvas>

        <!-- 모달 오버레이 (시작, 게임오버, 일시정지) -->
        <div id="gameOverlay" class="overlay">
          <h2 id="overlayTitle" class="overlay-title">동물 테트리스</h2>
          <p id="overlayDesc" class="overlay-desc">귀여운 동물 친구들과 함께하는 테트리스!</p>
          <button id="playBtn" class="play-btn">게임 시작하기 🐾</button>
        </div>
      </div>
    </div>

    <!-- 우측 사이드 패널 (PC) -->
    <aside class="side-panel right-panel">
      <!-- NEXT 카드 -->
      <div class="panel-card">
        <div class="panel-title">👀 NEXT</div>
        <div class="next-list">
          <canvas id="next1Canvas" class="next-item-canvas" width="80" height="60"></canvas>
          <canvas id="next2Canvas" class="next-item-canvas" width="80" height="60"></canvas>
          <canvas id="next3Canvas" class="next-item-canvas" width="80" height="60"></canvas>
        </div>
      </div>

      <!-- 점수 카드 -->
      <div class="panel-card">
        <div class="panel-title">🏆 SCORE</div>
        <div id="scoreValue" class="stat-value">0</div>
        <div class="panel-title" style="margin-top: 8px;">👑 BEST</div>
        <div id="highScoreValue" class="stat-value high">0</div>
      </div>

      <!-- 조작키 가이드 카드 -->
      <div class="panel-card">
        <div class="panel-title">🎮 조작키</div>
        <div class="key-guide">
          <div class="key-row"><span>이동</span><span class="key-badge">← →</span></div>
          <div class="key-row"><span>소프트드롭</span><span class="key-badge">↓</span></div>
          <div class="key-row"><span>하드드롭</span><span class="key-badge">Space</span></div>
          <div class="key-row"><span>회전</span><span class="key-badge">↑ / X / Z</span></div>
          <div class="key-row"><span>홀드</span><span class="key-badge">C / Shift</span></div>
          <div class="key-row"><span>일시정지</span><span class="key-badge">P / Esc</span></div>
        </div>
      </div>
    </aside>

  </main>

  <!-- 하단 동물 블록 매핑 도감 (PC) -->
  <footer class="animal-legend" id="animalLegend">
    <!-- animals.js에 의해 동적으로 채워집니다 -->
  </footer>

  <!-- 모바일 온스크린 가상 터치 컨트롤러 (스마트폰에서 표시) -->
  <div class="mobile-controls">
    <div class="ctrl-grid">
      <!-- 좌측 D-PAD -->
      <div class="dpad-wrap">
        <button id="btnMobHold" class="btn-ctrl btn-hold-mob" aria-label="홀드">HOLD</button>
        <button id="btnMobLeft" class="btn-ctrl btn-left" aria-label="왼쪽 이동">◀</button>
        <button id="btnMobDown" class="btn-ctrl btn-down" aria-label="소프트드롭">▼</button>
        <button id="btnMobRight" class="btn-ctrl btn-right" aria-label="오른쪽 이동">▶</button>
      </div>

      <!-- 우측 액션 버튼들 -->
      <div class="action-wrap">
        <button id="btnMobDrop" class="btn-action-drop" aria-label="하드드롭">
          ⚡
          <span>DROP</span>
        </button>
        <button id="btnMobRotate" class="btn-action-large" aria-label="회전">
          🔄
          <span>ROTATE</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 스크립트 모듈 로드 -->
  <script src="animals.js"></script>
  <script src="audio.js"></script>
  <script src="tetris.js"></script>
  <script src="app.js"></script>
</body>
</html>
